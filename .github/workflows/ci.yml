name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: fmt · clippy · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Capture, decoding and image I/O are all pure Rust now, so the only system
      # library left is ALSA, which cpal's alsa-sys finds through pkg-config.
      # ort fetches its ONNX Runtime itself.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev pkg-config

      # Swatinem caches the build artifacts with their dependency tree, so a restore
      # actually satisfies cargo's freshness check. The default automatic key includes
      # the job id, though, so every run computes a different key and no run ever
      # restores anything. A shared-key makes the key stable across runs and branches:
      # os + hash of the lockfile, toolchain files and .cargo/config.toml.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # End-to-end smoke test with no camera and no model assets.
      - name: Smoke test
        run: cargo run -- --mode mock --no-ui --max-frames 30 --debug

      # Regression gate on the gesture mapping. The mock hand is driven by the frame
      # index, so this trace is reproducible on any machine - no webcam, no ONNX
      # files, no Linux/macOS difference. It covers the detection gate, the estimator,
      # the grid strategy and the release path.
      - name: Golden trace (mock)
        run: cargo run -- --mode mock --no-ui --max-frames 120 --expect fixtures/mock_trace.json
