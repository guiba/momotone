name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: fmt · clippy · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The opencv crate generates its bindings with clang and needs the OpenCV
      # headers and libraries; cpal's alsa-sys needs ALSA's pkg-config entry.
      # ort fetches its ONNX Runtime itself.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libopencv-dev libasound2-dev libclang-dev clang pkg-config

      # bindgen only probes a fixed list of LLVM directories; pin it to whatever
      # LLVM the runner actually ships, as a real file rather than a versioned
      # symlink, so clang-sys' glob search can open it.
      - name: Point bindgen at the runner's libclang
        run: |
          clang_lib=$(find /usr/lib/llvm-*/lib -name 'libclang.so*' | head -1)
          clang_real=$(readlink -f "$clang_lib")
          echo "libclang symlink:  $clang_lib"
          echo "libclang resolved: $clang_real"
          if [ ! -f "$clang_real" ]; then
            echo "the libclang symlink is dangling; installing the runtime library"
            sudo apt-get install -y libclang1-21
            clang_real=$(readlink -f "$clang_lib")
          fi
          dir="$RUNNER_TEMP/libclang"
          mkdir -p "$dir"
          cp "$clang_real" "$dir/libclang.so"
          ls -l "$dir"
          echo "LIBCLANG_PATH=$dir" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # End-to-end smoke test with no camera and no model assets.
      - name: Smoke test
        run: cargo run -- --mode mock --no-ui --max-frames 30 --debug
