name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: fmt · clippy · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The opencv crate generates its bindings with clang and needs the OpenCV
      # headers and libraries; ort fetches its ONNX Runtime itself.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopencv-dev clang pkg-config

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # End-to-end smoke test with no camera and no model assets.
      - name: Smoke test
        run: cargo run -- --mode mock --no-ui --max-frames 30 --debug
