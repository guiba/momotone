[package]
name = "gesture_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
# CLI and Configuration
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

# Communication (The Glue)
crossbeam-channel = "0.5"

# Audio and MIDI
cpal = "0.17"
midir = "0.11"

# Vision & Math
opencv = { version = "0.100", features = ["clang-runtime"] }

# Concurrency/Async (Useful for management)
tokio = { version = "1.36", features = ["full"] }
ort = "2.0.0-rc.13"
