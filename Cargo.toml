[package]
name = "momotone"
version = "0.1.0"
edition = "2021"

[dependencies]
# CLI and Configuration
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

# Communication (The Glue)
crossbeam-channel = "0.5.17"

# Audio and MIDI
cpal = "0.18"
midir = "0.11.1"

# Vision & Math
opencv = { version = "0.102", features = ["clang-runtime"] }

# Async runtime - only needed as iced's executor for the UI subscription.
# `full` pulls in networking, fs and process support we never touch.
tokio = { version = "1.36", features = ["rt", "time"] }
ort = "2.0.0-rc.15"
iced = { version = "0.14.0", features = ["image", "canvas", "tokio"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Real-time budget is 33 ms/frame; cross-unit inlining and a single codegen unit
# are what make the ONNX/OpenCV hot path as tight as it can be on stable Rust.
[profile.release]
lto = "fat"
codegen-units = 1
